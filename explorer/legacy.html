<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PACBench Explorer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <b>PACBench Explorer</b> <span class="sub" id="h-meta"></span>
  <div class="sub" id="h-day"></div>
</header>
<nav id="tabs">
  <button id="tab-corpus" class="active">Corpus</button>
  <button id="tab-runs">Runs</button>
</nav>
<section id="corpus">
  <div id="ctl">
    <select id="life" title="life"></select>
    <span id="days"><button id="prev">&larr;</button><select id="day" title="day"></select><button id="next">&rarr;</button></span>
    <select id="chan" title="channel"></select>
    <select id="thr" title="thread"></select>
    <input id="q" placeholder="search text/sender" size="18">
  </div>
  <div id="count"></div>
  <div id="view"></div>
</section>
<section id="runs" hidden>
  <div id="runmeta"></div>
  <div id="runcards"></div>
  <h2>Run timeline</h2>
  <div id="runtimeline"></div>
  <h2 id="gradetitle"></h2>
  <div id="gradetable"></div>
  <h2 id="turnstitle"></h2>
  <div id="turns"></div>
</section>
<script src="app.js" defer></script>
</body>
</html>
