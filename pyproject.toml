[project]
name = "muse-budget-gateway"
version = "0.2.0"
description = "Local daily spending boundary for Spark model requests"
readme = "README.md"
requires-python = ">=3.11"
[project.optional-dependencies]
test = ["pytest>=8"]
[project.urls]
Repository = "https://github.com/cuuush/muse-gateway"
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
testpaths = ["tests"]
